services:
  studio:
    build:
      context: .
      args:
        # NEXT_PUBLIC_* are baked into the bundle at build time.
        # Changing these here after a build has no effect.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    environment:
      # Server-side secrets injected at runtime only
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      # nginx-proxy routing
      VIRTUAL_HOST: kanojostudio.com
      VIRTUAL_PORT: 4242
      # letsencrypt-companion SSL
      LETSENCRYPT_HOST: kanojostudio.com
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    restart: unless-stopped

networks:
  default:
    name: nginx-proxy-network
    external: true
