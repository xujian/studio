services:
  studio:
    image: ghcr.io/xujian/studio:latest
    environment:
      # Server-side secrets injected at runtime only
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      NANO_BANANA_MODEL: ${NANO_BANANA_MODEL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_BASIC_PRICE_ID: ${STRIPE_BASIC_PRICE_ID}
      STRIPE_CREATOR_PRICE_ID: ${STRIPE_CREATOR_PRICE_ID}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID}
      NEXT_PUBLIC_AXIOM_TOKEN: ${NEXT_PUBLIC_AXIOM_TOKEN}
      NEXT_PUBLIC_AXIOM_DATASET: ${NEXT_PUBLIC_AXIOM_DATASET}
      # nginx-proxy routing
      VIRTUAL_HOST: kanojostudio.com
      VIRTUAL_PORT: 4242
      # letsencrypt-companion SSL
      LETSENCRYPT_HOST: kanojostudio.com
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    restart: unless-stopped

networks:
  default:
    name: nginx-proxy-network
    external: true
